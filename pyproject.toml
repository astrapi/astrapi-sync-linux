[project]
name = "astrapi-sync-client"
version = "0.1.0"
description = "astrapi-sync – CLI-Client + geteilte Sync-Engine (Grundlage für die GTK4-App)"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "watchdog>=4.0",
]

[project.scripts]
astrapi-sync-cli = "astrapi_sync_client.cli:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["astrapi_sync_client*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
